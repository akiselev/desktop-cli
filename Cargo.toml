[package]
name = "desktop-cli"
version = "0.1.0"
edition = "2021"

description = "Desktop automation daemon with UI Automation (UIA) support for Windows. Query UI element trees, find elements with CSS-style selectors, and interact via accessibility patterns."
license = "GPL-3.0-only"
repository = "https://github.com/akiselev/desktop-cli"
homepage = "https://github.com/akiselev/desktop-cli"
documentation = "https://docs.rs/desktop-cli"
readme = "README.md"
authors = ["Alexander Kiselev <alex@akiselev.com>"]
keywords = ["automation", "accessibility", "windows", "uiautomation", "rpc", "llm"]
categories = ["command-line-utilities", "accessibility", "api-bindings", "os::windows-apis"]

[dependencies]
# RPC
remoc = { version = "0.18", features = ["rtc"] }
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
regex = "1"
png = "0.17"
directories = "5"
dirs = "5"
wildmatch = "2.6"

# Daemon (Unix only)
[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
nix = { version = "0.29", features = ["signal", "process"] }

# Windows Automation (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
win-screenshot = "4"
uiautomation = "0.24"
