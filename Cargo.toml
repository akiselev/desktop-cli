[package]
name = "desktop-cli"
version = "0.1.0"
edition = "2021"

description = "Cross-platform desktop automation CLI with accessibility API support for Windows, Linux, and macOS. Query UI element trees, find elements with CSS-style selectors, and interact via accessibility patterns."
license = "GPL-3.0-only"
repository = "https://github.com/akiselev/desktop-cli"
homepage = "https://github.com/akiselev/desktop-cli"
documentation = "https://docs.rs/desktop-cli"
readme = "README.md"
authors = ["Alexander Kiselev <alex@akiselev.com>"]
keywords = ["automation", "accessibility", "cross-platform", "uiautomation", "atspi", "llm"]
categories = ["command-line-utilities", "accessibility", "api-bindings"]

[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
regex = "1"
png = "0.17"
directories = "5"
dirs = "5"
wildmatch = "2.6"

# Windows Automation (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Wdk_System_Threading",
] }
win-screenshot = "4"
uiautomation = "0.24"

# Linux Automation (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xtest"] }
zbus = { version = "4", default-features = false, features = ["blocking"] }
libc = "0.2"

# macOS Automation (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"
